[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mealie-mcp"
version = "0.1.0"
description = "MCP server for Mealie: recipes, meal plans and shopping lists over Streamable HTTP with OAuth 2.1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kanylbullen" }]
keywords = ["mealie", "mcp", "model-context-protocol", "recipes", "meal-planning"]
dependencies = [
    # Upper bound is deliberate: the auth layer (RemoteAuthProvider, OAuthProxy,
    # JWTVerifier) is written and tested against fastmcp 3.x. Lift after testing on 4.x.
    "fastmcp>=3.3.1,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
mealie-mcp = "mealie_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mealie_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
